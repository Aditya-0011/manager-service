name: Publish and Deploy Manager Service Container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-manager-service
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/aditya-0011/manager-service

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          secrets: |
            GITHUB_TOKEN=${{ secrets.PAT_TOKEN }}

      - name: Deploy with Podman
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TARGET: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          port: 22
          envs: GHCR_TOKEN,GHCR_USER,TARGET
          script: |
            set -euo pipefail
            NAME=manager-service
            AUTHFILE="$(mktemp)"
            trap 'rm -f "$AUTHFILE"' EXIT

            echo "$GHCR_TOKEN" | podman login ghcr.io -u "$GHCR_USER" --password-stdin --authfile "$AUTHFILE"
            podman pull --authfile "$AUTHFILE" "$TARGET"
            podman logout --authfile "$AUTHFILE" ghcr.io || true

            PREVIOUS="$(podman inspect --format '{{.ImageName}}' "$NAME" 2>/dev/null || true)"

            start() {
              podman stop "$NAME" 2>/dev/null || true
              podman rm "$NAME" 2>/dev/null || true
              podman run -d \
                --name "$NAME" \
                --network host \
                --env-file ~/$NAME-production.conf \
                --restart unless-stopped \
                --memory 384m \
                --cpus 1 \
                --read-only \
                --tmpfs /tmp:rw,size=64m \
                --cap-drop ALL \
                --security-opt no-new-privileges \
                "$1"
            }

            start "$TARGET"
            sleep 10
            if [ "$(podman inspect --format '{{.State.Running}}' "$NAME")" != "true" ]; then
              echo "::error::$NAME failed to start"
              podman logs --tail 50 "$NAME" || true
              if [ -n "$PREVIOUS" ]; then
                echo "Rolling back to $PREVIOUS"
                start "$PREVIOUS"
              fi
              exit 1
            fi

            podman image prune -f
